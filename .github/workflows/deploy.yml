name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # A custom domain (CNAME file) serves from the root; without one, a project
      # site serves from /<repo>, so asset links need that prefix.
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -f CNAME ] || [ "${REPO%.github.io}" != "$REPO" ]; then
            echo "Serving from root — building without a base path"
            node build.mjs
          else
            echo "Project site — building with base path /$REPO"
            BASE_PATH="/$REPO" node build.mjs
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
